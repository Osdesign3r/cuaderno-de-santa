name: Descomprimir proyecto
on:
  push:
    paths:
      - '.github/workflows/descomprimir.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y mover a la raíz
        run: |
          if [ ! -f cuaderno-de-santa.zip ]; then echo "No hay zip: nada que hacer."; exit 0; fi
          unzip -q cuaderno-de-santa.zip
          cp -a cuaderno-de-santa/. .
          rm -rf cuaderno-de-santa cuaderno-de-santa.zip
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Descomprimir el proyecto" && git push)
